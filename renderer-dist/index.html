      api.queue.onStateChanged((data) => {
        state.queueState = { ...state.queueState, ...data };
        if (state.currentPage === 'queue') renderPage();
      });
    }

    // ==================== SIP DEBUG CONSOLE ====================
    let debugConsoleVisible = false;
    let debugMessages = [];
    const MAX_DEBUG_MESSAGES = 500;

    function toggleDebugConsole() {
      debugConsoleVisible = !debugConsoleVisible;
      const panel = document.getElementById('sipDebugConsole');
      if (panel) {
        panel.style.display = debugConsoleVisible ? 'block' : 'none';
      }
      // Re-create lucide icons in the panel
      if (debugConsoleVisible) {
        try { lucide.createIcons({ nodes: [panel] }); } catch(e) {}
      }
    }

    function clearDebugConsole() {
      debugMessages = [];
      const logArea = document.getElementById('debugLogArea');
      if (logArea) logArea.innerHTML = '';
      const countEl = document.getElementById('debugMsgCount');
      if (countEl) countEl.textContent = '0 messages';
    }

    function addDebugMessage(data) {
      const time = new Date(data.timestamp).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
      const dirColor = data.direction === 'TX' ? '#58a6ff' : '#3fb950';
      const lineText = data.line ? data.line.substring(3) : '';
      const lineHtml = `<div style="margin:1px 0;"><span style="color:#484f58;">${time}</span> <span style="color:${dirColor};font-weight:600;">${data.direction}</span> <span style="color:#c9d1d9;">${escapeHtml(lineText)}</span>${data.lineId ? ` <span style="color:#8b949e;">[${data.lineId}]</span>` : ''}</div>`;
      debugMessages.push(lineHtml);
      if (debugMessages.length > MAX_DEBUG_MESSAGES) {
        debugMessages.shift();
      }
      const logArea = document.getElementById('debugLogArea');
      if (logArea && debugConsoleVisible) {
        // Use insertAdjacentHTML instead of innerHTML += to avoid re-parsing entire DOM
        logArea.insertAdjacentHTML('beforeend', lineHtml);
        // Trim old entries from DOM if too many
        while (logArea.children.length > MAX_DEBUG_MESSAGES) {
          logArea.removeChild(logArea.firstChild);
        }
        logArea.scrollTop = logArea.scrollHeight;
      }
      const countEl = document.getElementById('debugMsgCount');
      if (countEl) countEl.textContent = debugMessages.length + ' messages';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Listen for SIP debug messages from main process
    if (window.electronAPI?.sipDebug) {
      window.electronAPI.sipDebug.onMessage((data) => {
        addDebugMessage(data);
      });
    }

    // ==================== INIT ====================
    async function init() {
      await loadPersistedSettings();

      // Load queue settings
      if (api?.queue) {
        try {
          const qSettings = await api.queue.getSettings();
          if (qSettings) state.queueSettings = qSettings;
          const qState = await api.queue.getState();
          if (qState) state.queueState = { ...state.queueState, ...qState };
        } catch (e) { /* ignore */ }
      }

      // Load notification preference
      if (api?.notification) {
        try {
          const enabled = await api.notification.getEnabled();
          state.nativeNotifications = enabled !== false;
        } catch (e) { /* ignore */ }
      }

      // Check protocol handler status
      if (api?.protocol) {
        try {
          const status = await api.protocol.isRegistered();
          state.protocolStatus = status || { tel: false, sip: false, callto: false };
        } catch (e) { /* ignore */ }
      }

      // Load multi-line state
      if (api?.line) {
        try {
          const lines = await api.line.getAll();
          if (lines) state.lines = lines;
          const active = await api.line.getActive();
          if (active) state.activeLineId = active;
        } catch (e) { /* ignore */ }
      }

      // Load app version from Electron
      if (api?.update) {
        try {
          const version = await api.update.getVersion();
          if (version) state.appVersion = version;
        } catch (e) { /* ignore */ }
      }

      renderPage();
      lucide.createIcons();
      updateStatusBar();
      console.log('[CloudPhone Pro] Initialized v' + state.appVersion);

      // ===== AUTO-REGISTER on startup if saved SIP credentials exist =====
      await autoRegisterOnStartup();
    }

    async function autoRegisterOnStartup() {
      try {
        const config = state.sipConfig;
        if (!config.server || !config.username || !config.password) {
          console.log('[Auto-Register] No saved SIP credentials, skipping auto-register');
          return;
        }
        console.log('[Auto-Register] Found saved credentials for', config.username + '@' + config.server);
        showToast('Auto-registering with ' + config.server + '...', 'info');
        if (api?.sip) {
          await api.sip.register(config);
          console.log('[Auto-Register] Registration request sent');
        }
      } catch (err) {
        console.error('[Auto-Register] Failed:', err);
        showToast('Auto-register failed: ' + (err.message || 'Unknown error'), 'error');
      }
    }

    init();
  </script>
</body>
</html>
